<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rivalyze</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;   /* KEY FIX */
      height: 100vh;
    }

    .navbar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }

    .logo {
      height: 40px;
      width: auto;
    }

    /* Fallback if logo.jpeg fails to load */
    .logo-fallback {
      height: 40px;
      width: 40px;
      background: #22c55e;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: white;
    }

    .brand-name {
      margin-left: 10px;
      font-size: 20px;
      font-weight: 600;
      color: #111;
    }

    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      max-width: 500px;
      padding: 0 20px;
      width: 100%;
    }

    h1 { font-size: 22px; margin-bottom: 20px; }

    .fact {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 30px;
      min-height: 40px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #22c55e;
      animation: load 22s linear forwards;
    }

    @keyframes load {
      from { width: 0%; }
      to { width: 100%; }
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <img
      src="logo.jpeg"
      alt="Rivalyze Logo"
      class="logo"
      onerror="this.style.display='none'; document.getElementById('logo-fb').style.display='flex';"
    >
    <div class="logo-fallback" id="logo-fb" style="display:none;">R</div>
    <div class="brand-name">Rivalyze</div>
  </div>

  <div class="main">
    <div class="container">
      <h1>🚀 Generating Your AI Competitor Report...</h1>
      <div class="fact" id="fact">Analyzing brand positioning...</div>
      <div class="progress-bar">
        <div class="progress"></div>
      </div>
      <div class="note">This may take up to 1–2 minutes. Check your email shortly.</div>
    </div>
  </div>

  <script>
    const facts = [
      "Analyzing brand positioning...",
      "Scanning competitor ad strategies...",
      "Identifying audience targeting patterns...",
      "Evaluating messaging frameworks...",
      "Comparing strengths & weaknesses...",
      "Generating strategic insights...",
      "Almost done..."
    ];
    let index = 0;
    setInterval(() => {
      index = (index + 1) % facts.length;
      document.getElementById("fact").innerText = facts[index];
    }, 3000);
  </script>
</body>
</html>
